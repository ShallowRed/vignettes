title: Bloc marque de l'État
decks:
  - slug: recette-bloc-marque
    file: test/recette/decks/recette-bloc-marque.md
  - slug: recette-bloc-marque-toutes
    file: test/recette/decks/recette-bloc-marque-toutes.md
  - slug: recette-bloc-marque-cadre
    file: test/recette/decks/recette-bloc-marque-cadre.md
checks:
  - account: editor
    page: /slides/recette-bloc-marque
    expect: La diapositive de titre affiche en haut à gauche, directement sur son fond, Marianne, « Ministère de l'Intérieur » sur deux lignes, la devise et le pictogramme de la Police nationale à droite ; la deuxième diapositive n'affiche pas le bloc marque.
  - account: editor
    page: /slides/recette-bloc-marque-toutes
    expect: Les six diapositives affichent le bloc marque avec l'intitulé sur trois lignes, et le titre de chaque diapositive commence sous le bloc marque. Il est posé sur le fond des diapositives claires et dans un cadre blanc sur l'image « Le terrain ». Sur la section bleue « Première partie » et sur l'image voilée « Les résultats attendus », il est tout en blanc, Marianne découpée dans un drapeau blanc, l'intitulé et la devise en blanc.
  - account: editor
    page: /slides/recette-bloc-marque-cadre#/1
    expect: La section bleue « Les signalements de l'année » affiche le bloc marque en couleur dans un cadre blanc, et son titre commence sous le cadre.
  - account: editor
    page: /slides/recette-bloc-marque-toutes?print-pdf
    expect: Dans l'aperçu avant impression de Chrome, les six pages affichent le bloc marque à la même place et dans la même version qu'à l'écran.
  - account: editor
    page: /
    expect: Dans le dossier « Sans dossier », les cartes des trois présentations d'essai du bloc marque affichent le bloc marque en haut à gauche de leur aperçu, à la même échelle que sur la diapositive.
