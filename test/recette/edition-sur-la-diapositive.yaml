title: Modification sur la diapositive
decks:
  - slug: recette-edition-sur-la-diapositive
    file: test/recette/decks/recette-edition-sur-la-diapositive.md
  - slug: recette-edition-separateurs
    file: test/recette/decks/recette-edition-separateurs.md
checks:
  - account: editor
    page: /edit/recette-edition-sur-la-diapositive
    expect: Sur la diapositive « Ce que nous avons livré », un clic sur « Le nouvel éditeur de présentations » dans l'aperçu sélectionne ce texte dans la source de la présentation, et l'aperçu reste sur la même diapositive.
  - account: editor
    page: /edit/recette-edition-sur-la-diapositive
    expect: Sur la même diapositive, un contour fin entoure au survol le titre, chaque puce et le paragraphe. Un double-clic sur le titre le rend modifiable ; « ce trimestre » tapé à la fin puis Entrée change le titre dans la source de la présentation et dans l'aperçu, et un seul Cmd+Z dans la source de la présentation rend l'ancien titre.
  - account: editor
    page: /edit/recette-edition-sur-la-diapositive
    expect: Sur la même diapositive, un double-clic sur « L'import des présentations existantes » modifie cette puce seule et laisse visibles ses deux puces imbriquées ; un double-clic sur « Le guide de démarrage » garde la case devant le texte.
  - account: editor
    page: /edit/recette-edition-sur-la-diapositive
    expect: Sur la diapositive « Un titre avec du gras », un double-clic sur le titre montre « Un **titre** avec du gras » pendant la modification ; Échap rend le titre d'origine, et la source de la présentation reste inchangée.
  - account: editor
    page: /edit/recette-edition-sur-la-diapositive
    expect: Sur la même diapositive, un mot ajouté à la fin de la citation puis Entrée garde les deux lignes de la citation, chacune avec son « > » dans la source de la présentation.
  - account: editor
    page: /edit/recette-edition-sur-la-diapositive
    expect: >-
      Sur la même diapositive, « Bilan: fin » tapé dans le paragraphe puis Entrée s'écrit « Bilan: fin » dans la source de la présentation, sans espace ajoutée avant les deux-points.
  - account: editor
    page: /edit/recette-edition-sur-la-diapositive
    expect: >-
      Sur la même diapositive, « - une puce » tapé à la place du paragraphe puis Entrée garde un paragraphe dans l'aperçu, et la source de la présentation montre « \- une puce ».
  - account: editor
    page: /edit/recette-edition-sur-la-diapositive
    expect: Sur la diapositive « Les étapes une à une », avec le bouton « Afficher les éléments un par un » activé, un clic sur « Deuxième étape » sélectionne son texte sans changer l'étape affichée.
  - account: editor
    page: /edit/recette-edition-sur-la-diapositive
    expect: La même page ouverte dans un second onglet ; un double-clic sur « depuis une adresse » dans le premier, un mot changé au milieu de cette puce dans la source de la présentation du second, puis Entrée dans le premier affichent un message qui dit que le texte a été modifié, avec un bouton « Copier le texte » ; un mot ajouté à la fin de la puce par le second onglet s'ajoute au texte tapé dans le premier, sans message.
  - account: editor
    page: /edit/recette-edition-separateurs
    expect: Sur la diapositive verticale « Une diapositive verticale », un double-clic sur « Une puce », un mot ajouté puis Entrée modifient cette puce dans la source de la présentation ; l'aperçu reste sur la diapositive verticale.
