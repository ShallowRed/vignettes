title: Icônes et pictogrammes dans l'éditeur
decks:
  - slug: recette-icones-dsfr
    file: test/recette/decks/recette-icones-dsfr.md
  - slug: recette-icones-minimal
    file: test/recette/decks/recette-icones-minimal.md
checks:
  - account: editor
    page: /edit/recette-icones-dsfr
    expect: Dans `icon="ri:server-line"` de la deuxième étape, effacer `server-line` puis taper `user` ouvre la liste des icônes Remix qui contiennent « user », chacune avec sa catégorie, et la bulle à côté de la liste montre le dessin de l'icône choisie au clavier.
  - account: editor
    page: /edit/recette-icones-dsfr
    expect: Dans `picto="buildings/city-hall"` de la première étape, effacer la valeur puis taper `doc` ouvre la liste des pictogrammes `document/…`, la bulle montre le pictogramme en couleurs, et Entrée écrit le chemin choisi entre les guillemets.
  - account: editor
    page: /edit/recette-icones-dsfr
    expect: Taper `icon` dans les accolades d'un `::Step` puis choisir l'attribut ouvre la liste des icônes, et `:i{name="` dans une phrase ouvre la même liste.
  - account: editor
    page: /edit/recette-icones-dsfr
    expect: Le bouton « Icônes » de la barre ouvre à droite le panneau « Icônes et pictogrammes » ; taper `user` dans la recherche ne garde que les icônes qui contiennent « user », et chaque catégorie affiche son nombre de résultats.
  - account: editor
    page: /edit/recette-icones-dsfr
    expect: Dans le panneau, taper `maison` montre les icônes `home-…`, et l'onglet « Pictogrammes » montre `house` ; `flèche` montre les icônes `arrow-…`.
  - account: editor
    page: /edit/recette-icones-dsfr
    expect: Dans le panneau, « Plein » remplace les icônes `…-line` de la grille par leurs versions `…-fill`, et « Contour » les rend.
  - account: editor
    page: /edit/recette-icones-dsfr
    expect: En largeur de téléphone, le panneau occupe l'écran, les catégories sont dans une liste déroulante sous la recherche, et les tuiles de la grille gardent leur nom lisible.
  - account: editor
    page: /edit/recette-icones-dsfr
    expect: Le curseur dans la ligne `::Step{n="2" …}`, un clic sur une icône du panneau remplace `icon` de cette étape, l'aperçu la montre, et sa tuile reste marquée dans la grille.
  - account: editor
    page: /edit/recette-icones-dsfr
    expect: Le curseur dans la première étape, onglet « Pictogrammes », catégorie « Documents », un clic sur `passport` remplace `picto="buildings/city-hall"` par `picto="document/passport"`.
  - account: editor
    page: /edit/recette-icones-dsfr
    expect: Le curseur dans la phrase de la dernière ligne, un clic sur une icône insère `:i{name="ri:…"}` au curseur, et la catégorie « Dans cette présentation » compte une icône de plus.
  - account: editor
    page: /edit/recette-icones-dsfr
    expect: Sur une nouvelle ligne, taper `:i{name="ri:arrow-down-line"}` lettre par lettre garde l'aperçu à jour, sans bandeau « L'aperçu montre la dernière version lisible », et la flèche apparaît à la fin de la frappe.
  - account: editor
    page: /edit/recette-icones-dsfr
    expect: Dans `icon=""` d'une étape, Cmd+Maj+Espace ouvre une liste qui commence par « Parcourir les icônes… », et Entrée sur cette ligne ouvre le panneau.
  - account: editor
    page: /edit/recette-icones-minimal
    expect: Dans ce deck au thème `minimal`, effacer `server-line` dans `icon="ri:server-line"` n'ouvre aucune liste, et la barre n'a pas de bouton « Icônes ».
