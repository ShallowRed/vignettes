title: Attributs vides ou sans valeur
decks:
  - slug: recette-attributs-vides
    file: test/recette/decks/recette-attributs-vides.md
checks:
  - account: editor
    page: /edit/recette-attributs-vides
    expect: "L'aperçu montre les neuf diapositives, et la liste des problèmes en compte 19, de « Ligne 15 : « effect » sans valeur » à « Ligne 96 : « spot » sans valeur », avec « Ligne 56 : attribut « values » manquant » et « Ligne 68 : « id » sans valeur »."
  - account: editor
    page: /slides/recette-attributs-vides?draft#/fragments-sans-effet
    expect: La flèche droite fait apparaître les deux points un par un, en fondu.
  - account: editor
    page: /slides/recette-attributs-vides?draft#/fragments-avec-deux-effets
    expect: La flèche droite fait apparaître les deux points un par un ; chacun monte et grandit en apparaissant.
  - account: editor
    page: /slides/recette-attributs-vides?draft#/colonne-sans-largeur
    expect: Les deux colonnes ont la même largeur.
  - account: editor
    page: /slides/recette-attributs-vides?draft#/mermaid-sans-etapes
    expect: Le diagramme A vers B s'affiche entier dès l'arrivée sur la diapositive.
  - account: editor
    page: /slides/recette-attributs-vides?draft#/etat-sans-valeurs
    expect: "Après quatre appuis sur la flèche droite, la flèche « Demande » va d'Usager à Service, la rangée « Brouillon » n'a aucune valeur, la remarque couvre les deux participants, et la rangée « Envoyé » montre « Envoyé » et « Reçu »."
  - account: editor
    page: /slides/recette-attributs-vides?draft#/diagramme-automatique-noeud-sans-nom
    expect: 'Après les étapes, les cartes « Sans nom », « Source » et « Destination » sont dessinées, avec une seule flèche, de Source vers Destination.'
  - account: editor
    page: /slides/recette-attributs-vides?draft#/diagramme-en-grille-attributs-sans-valeur
    expect: 'Après les étapes, Source et Destination sont côte à côte et reliées par une flèche, et la zone « Zone », sans case donnée, se place sous Source.'
  - account: editor
    page: /slides/recette-attributs-vides?draft#/lecture-de-fichier-attributs-sans-valeur
    expect: "Le fichier exemple.json s'affiche à droite de la zone « Identité », sans mot surligné ni souligné."
