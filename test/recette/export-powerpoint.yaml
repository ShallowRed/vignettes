title: Export PowerPoint
decks:
  - slug: recette-export-powerpoint
    file: test/recette/decks/recette-export-powerpoint.md
checks:
  - account: owner
    page: /slides/recette-export-powerpoint
    expect: La barre de commandes, en haut à droite, propose « Exporter en PowerPoint » après « Imprimer ou exporter en PDF » ; un clic télécharge recette-export-powerpoint.pptx.
  - account: owner
    page: /slides/recette-export-powerpoint
    expect: Ouvert dans PowerPoint sans demande de réparation, le fichier a 16 diapositives en Marianne, ou en police de remplacement quand Marianne manque ; le titre et le texte de chaque diapositive se modifient, et l'onglet « Masque des diapositives » liste les dispositions « Titre », « Section », « Contenu », « Contenu, média à droite 1/2 » et « Contenu, média à droite 2/3 ».
  - account: owner
    page: /slides/recette-export-powerpoint
    expect: Le fichier ressemble à la présentation dans le navigateur, avec la diapositive de titre sur fond bleu très clair avec le titre en bleu, sections sur fond bleu avec le titre en blanc, en-tête du tableau en bleu, code sur fond sombre, liens et message clé en bleu, et le corps de chaque diapositive à la même hauteur que dans la présentation.
  - account: owner
    page: /slides/recette-export-powerpoint
    expect: Dans le fichier, les notes de la diapositive « Paragraphes et listes » sont dans les notes du présentateur ; la story et le schéma sont des cadres gris avec leur nom, et le lien de la story ouvre le Storybook d'exemple.
  - account: owner
    page: /slides/recette-export-powerpoint
    expect: Dans le fichier, l'image de python.org, que ce site sert sans en-tête CORS, est un cadre avec son texte alternatif, et le fichier montre l'image d'exemple de Wikimedia à droite et sous le voile.
  - account: owner
    page: /slides/summit-rules-registry
    expect: Sur ce deck du thème summit, dont le theme.json local déclare la police Quicksand à incorporer, le fichier exporté et ouvert dans PowerPoint sur un ordinateur sans Quicksand montre le texte en Quicksand.
