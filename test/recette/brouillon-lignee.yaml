title: Brouillon partagé de l'éditeur
decks:
  - slug: recette-lignee
    file: test/recette/decks/recette-lignee.md
checks:
  - account: owner
    page: /
    expect: La carte « Recette · Brouillon partagé » n'affiche pas « Modifications non publiées ».
  - account: editor
    page: /edit/recette-lignee
    expect: L'éditeur affiche le texte de la présentation une seule fois, et une frappe passe l'en-tête à « Enregistré ».
  - account: editor
    page: /edit/recette-lignee
    expect: Après un rechargement de la page, le texte tapé est là, une seule fois, et la carte du catalogue affiche « Modifications non publiées ».
  - account: editor
    page: /edit/recette-lignee?solo
    expect: En mode solo, une modification s'enregistre par le bouton Enregistrer, et rouvrir l'éditeur en temps réel montre ce texte une seule fois.
