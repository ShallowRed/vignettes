title: Kit de recette de branche
decks:
  - slug: recette-branche
    file: test/recette/decks/recette-branche.md
checks:
  - account: owner
    page: /recette
    expect: La section « Recette de la branche » liste ce fichier, ses cinq vérifications, et le bouton « Recréer les présentations d'essai ».
  - account: editor
    page: /edit/recette-branche
    expect: L'éditeur ouvre la présentation d'essai « Recette · Branche ».
  - account: editor
    page: /slides/recette-branche?draft#/une-deuxieme-diapositive
    expect: Le brouillon s'ouvre sur « Une deuxième diapositive », sous le bandeau « Aperçu du brouillon, non publié ».
  - account: anonymous
    page: /slides/recette-branche
    expect: La page dit « Présentation privée » et propose de se connecter.
  - account: viewer
    page: /
    expect: Le catalogue ne liste pas « Recette · Branche ».
