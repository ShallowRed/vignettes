title: Taille du texte et marges réduites
decks:
  - slug: recette-taille-du-texte
    file: test/recette/decks/recette-taille-du-texte.md
checks:
  - account: editor
    page: /edit/recette-taille-du-texte
    expect: Avec le curseur dans « Un texte court », le panneau « Mise en page » annonce « Le texte tient aussi en lg, un cran plus grand. » ; chaque cran de « Taille du texte », de xs à xl, change la taille de la liste dans l'aperçu et laisse le titre à sa taille, et l'écart entre deux crans voisins se voit sans être brutal.
  - account: editor
    page: /edit/recette-taille-du-texte
    expect: Avec le curseur dans « Un texte trop long », le panneau annonce « Le texte tient avec le titre compact, la taille sm et les marges réduites. » ; « Appliquer » écrit ces trois réglages dans « :layout », les quatorze points tiennent dans la diapositive et restent lisibles, et un seul Cmd+Z dans la source rend la diapositive d'origine.
  - account: editor
    page: /edit/recette-taille-du-texte
    expect: Avec le curseur dans « Une image dans le corps », un clic sur « À gauche » retire l'image du corps de la diapositive et l'écrit dans « :layout » avec sa description ; l'aperçu montre l'image à gauche du texte, sans message d'erreur entre les deux états.
  - account: editor
    page: /edit/recette-taille-du-texte
    expect: Avec le curseur dans « Une diapositive sans média », un clic sur « À droite » affiche l'image de remplacement à droite du texte, et le champ « Adresse de l'image ou de la page » du panneau contient son adresse, prête à être remplacée.
  - account: editor
    page: /edit/recette-taille-du-texte
    expect: Avec le curseur dans « Une image avec sa légende », les cinq placements du média sont estompés, et leur survol affiche « Ce média a une légende ou un réglage que la mise en page ne reprend pas ».
