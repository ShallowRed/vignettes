title: Vue plan
decks:
  - slug: recette-vue-plan
    file: test/recette/decks/recette-vue-plan.md
  - slug: recette-vue-plan-separateurs
    file: test/recette/decks/recette-vue-plan-separateurs.md
checks:
  - account: editor
    page: /edit/recette-vue-plan
    expect: Le bouton « Plan » de la barre sous la source ouvre à gauche de la source la liste des six diapositives ; « Le détail de l'import » est en retrait sous « Ce qui est livré », la dernière s'appelle « Sans titre », et le plan reste ouvert après un rechargement de la page.
  - account: editor
    page: /edit/recette-vue-plan
    expect: Un clic sur « Ce qui arrive » dans le plan place le curseur sur cette diapositive dans la source et l'aperçu l'affiche ; le plan marque la diapositive du curseur quand on se déplace dans la source.
  - account: editor
    page: /edit/recette-vue-plan
    expect: Glisser « Ce qui arrive » au-dessus de « Ce qui est livré » change l'ordre dans le plan, la source et l'aperçu ; un seul Cmd+Z dans le plan rend l'ordre d'origine.
  - account: editor
    page: /edit/recette-vue-plan
    expect: Avec le focus sur la ligne « Les prochaines étapes », Alt+↑ la monte d'une place, et la ligne garde le focus.
  - account: editor
    page: /edit/recette-vue-plan
    expect: Un double-clic sur « Les prochaines étapes » montre « Les **prochaines** étapes » dans un champ ; « Les prochaines étapes de décembre » puis Entrée change le titre dans la source, marques comprises.
  - account: editor
    page: /edit/recette-vue-plan
    expect: Le menu de « Ce qui est livré » propose « Dupliquer la pile » et « Supprimer la pile » ; « Supprimer la pile » retire aussi « Le détail de l'import », et le bouton « Annuler » du message la remet.
  - account: editor
    page: /edit/recette-vue-plan
    expect: Glisser « Sans titre » juste après « Feuille de route » affiche le message « Cette opération changerait le découpage de la présentation » et laisse la source inchangée.
  - account: editor
    page: /edit/recette-vue-plan-separateurs
    expect: Déplacer « Troisième diapositive » à la première place garde les séparateurs « --- » et « ---- » entre les diapositives, et la source ne commence pas par « --- ».
