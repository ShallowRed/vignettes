# pnpm audit skips four advisories without a patched release: node-forge comes
# with listhen, the development server of Nuxt, braces with @parcel/watcher, and
# picomatch with vite, unstorage and @nuxt/icon at build time. One more covers
# zod 3, which @nuxt/content requires for the documentation site: the fix
# shipped in zod 4.6.6. The built server contains none of these packages.
auditConfig:
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv
    - GHSA-vfj7-8cjw-p6xm
    - GHSA-mrhx-c7xc-m3w5
    - GHSA-fc5q-39xc-vjpf

catalogMode: prefer

cleanupUnusedCatalogs: true

shellEmulator: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - chokidar@4.0.3
  - semver@6.3.1
packages:
  - packages/*
  - site
# The overrides without a comment force the releases past the high and
# critical advisories of the production dependencies, in the major version
# their dependents accept.
overrides:
  # One release of @iconify/utils for every dependent: the Vite server build of
  # Nuxt imports the copy that @nuxt/icon resolves by its path, and Nitro turns
  # that path back into the package name only when the root copy is the same.
  '@iconify/utils@3': ^3.1.4
  '@nuxt/devtools': ^3.4.4
  # The schema of the installed nuxt for every module: @nuxt/ui, @nuxt/fonts and
  # @nuxt/icon would otherwise keep 4.6.2, which GHSA-mjrq-cffv-q4qc affects.
  '@nuxt/schema@4': 'catalog:'
  # The two unhead overrides resolve one release of unhead 3 for every
  # dependent, so that the built server contains `unhead/legacy` and starts.
  '@unhead/vue@3': ^3.4.3
  brace-expansion@1: ^1.1.20
  brace-expansion@2: ^2.1.6
  defu: ^6.1.5
  flatted: ^3.4.2
  h3@1: ^1.15.9
  # pptxgenjs declares `https`, an empty npm package: its code imports Node's
  # own `node:https`.
  https: '-'
  immutable: ^5.1.8
  js-yaml@4: ^4.3.2
  launch-editor: ^2.14.2
  lodash-es: ^4.18.0
  minimatch@3: ^3.1.4
  minimatch@9: ^9.0.7
  nanoid@3: ^3.3.18
  # From 2.13.5, Nitro closes the websockets of the dev worker it replaces, and
  # that worker stops with its database.
  nitropack: ^2.13.5
  node-forge: ^1.4.1
  picomatch@4: ^4.0.4
  # pptxgenjs also declares the Node types as a runtime dependency, an older
  # line than the workspace's own `@types/node`.
  pptxgenjs>@types/node: '-'
  # pptxgenjs declares image-size and imports it nowhere: its code names it in a
  # commented function only, and its `browser` field maps it to false.
  pptxgenjs>image-size: '-'
  shell-quote: ^1.11.0
  source-map-js: ^1.2.2
  # See '@unhead/vue@3' above.
  unhead@3: ^3.4.3
  vite@8: ^8.3.3

catalog:
  '@antfu/eslint-config': ^6.4.2
  '@aws-sdk/client-s3': ^3.1085.0
  '@codemirror/autocomplete': ^6.20.3
  '@codemirror/commands': ^6.10.4
  '@codemirror/lang-javascript': ^6.2.5
  '@codemirror/lang-json': ^6.0.2
  '@codemirror/lang-markdown': ^6.5.0
  '@codemirror/lang-yaml': ^6.1.3
  '@codemirror/language': ^6.12.4
  '@codemirror/merge': ^6.12.2
  '@codemirror/search': ^6.5.11
  '@codemirror/state': ^6.7.0
  '@codemirror/view': ^6.43.2
  '@dagrejs/dagre': ^3.1.1
