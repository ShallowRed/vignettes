  tailwindcss: ^4.1.17
  typescript: ^5.9.3
  unist-util-visit: ^5.0.0
  vitest: ^4.1.9
  vue: ^3.5.43
  vue-codemirror6: ^1.5.2
  vue-router: ^4.6.3
  vue-tsc: ^3.3.11
  y-codemirror.next: ^0.3.5
  yjs: ^13.6.31
  zod: ^4.6.7

onlyBuiltDependencies:
