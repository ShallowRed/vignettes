# pnpm audit skips three advisories without a patched release: node-forge comes
# with listhen, the development server of Nuxt, and braces with @parcel/watcher.
# The third covers zod 3, which @nuxt/content requires for the documentation
# site: the fix shipped in zod 4.6.6. The built server contains none of these
# packages.
auditConfig:
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv
    - GHSA-vfj7-8cjw-p6xm
    - GHSA-mrhx-c7xc-m3w5

catalogMode: prefer

cleanupUnusedCatalogs: true

shellEmulator: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - chokidar@4.0.3
  - semver@6.3.1
packages:
  - packages/*
  - site
# The overrides without a comment force the releases past the high and
# critical advisories of the production dependencies, in the major version
# their dependents accept.
overrides:
  '@nuxt/devtools': ^3.4.4
  # The two unhead overrides resolve one release of unhead 3 for every
  # dependent, so that the built server contains `unhead/legacy` and starts.
  '@unhead/vue@3': ^3.4.3
  brace-expansion@1: ^1.1.20
  brace-expansion@2: ^2.1.6
  defu: ^6.1.5
  flatted: ^3.4.2
  h3@1: ^1.15.9
  # pptxgenjs declares `https`, an empty npm package: its code imports Node's
  # own `node:https`.
  https: '-'
  immutable: ^5.1.8
  js-yaml@4: ^4.3.2
  launch-editor: ^2.14.2
  lodash-es: ^4.18.0
  minimatch@3: ^3.1.4
  minimatch@9: ^9.0.7
  nanoid@3: ^3.3.18
  # From 2.13.5, Nitro closes the websockets of the dev worker it replaces, and
  # that worker stops with its database.
  nitropack: ^2.13.5
  node-forge: ^1.4.1
  picomatch@4: ^4.0.4
  # pptxgenjs also declares the Node types as a runtime dependency, an older
  # line than the workspace's own `@types/node`.
  pptxgenjs>@types/node: '-'
  # pptxgenjs declares image-size and imports it nowhere: its code names it in a
  # commented function only, and its `browser` field maps it to false.
  pptxgenjs>image-size: '-'
  shell-quote: ^1.11.0
  source-map-js: ^1.2.2
  # See '@unhead/vue@3' above.
  unhead@3: ^3.4.3
  vite@8: ^8.3.3

catalog:
  '@antfu/eslint-config': ^6.4.2
  '@aws-sdk/client-s3': ^3.1085.0
  '@codemirror/autocomplete': ^6.20.3
  '@codemirror/commands': ^6.10.4
  '@codemirror/lang-javascript': ^6.2.5
  '@codemirror/lang-json': ^6.0.2
  '@codemirror/lang-markdown': ^6.5.0
  '@codemirror/lang-yaml': ^6.1.3
  '@codemirror/language': ^6.12.4
  '@codemirror/merge': ^6.12.2
  '@codemirror/search': ^6.5.11
  '@codemirror/state': ^6.7.0
  '@codemirror/view': ^6.43.2
  '@dagrejs/dagre': ^3.1.1
  '@electric-sql/pglite': ^0.5.10
  '@gouvfr/dsfr': ^1.15.3
  '@hocuspocus/provider': ^4.3.0
  '@hocuspocus/server': ^4.3.0
  '@iconify-json/fluent': ^1.2.58
  '@iconify-json/lucide': ^1.2.117
  '@iconify-json/ri': ^1.2.6
  '@iconify/vue': ^5.0.0
  '@lezer/highlight': ^1.2.3
  '@nuxt/fonts': ^0.14.0
  '@nuxt/icon': ^2.1.0
  # The schema of the installed nuxt, which the site declares: the modules Docus
  # brings accept any Nuxt 4 and would otherwise install @nuxt/schema 4.6, which
  # the hoisting places at the root, where the studio reads the types of Nitro.
  '@nuxt/schema': 4.5.2
  '@nuxt/ui': ^4.9.0
  '@nuxtjs/i18n': ^10.6.0
  '@nuxtjs/mdc': ^0.23.2
  '@pinia/colada': ^1.4.2
  '@pinia/colada-nuxt': ^1.0.2
  '@pinia/nuxt': ^1.0.1
  '@playwright/test': 1.63.0
  '@takumi-rs/core': ^2.17.1
  '@tanstack/vue-table': ^8.21.3
  '@types/better-sqlite3': ^7.6.13
  '@types/js-yaml': ^4.0.9
  '@types/node': ^24.10.1
  '@types/pg': ^8.23.1
  better-sqlite3: ^12.11.1
  codemirror: ^6.0.2
  concurrently: ^9.2.1
  docus: ~5.14.0
  drizzle-kit: ^0.31.10
  drizzle-orm: ^0.45.2
  eslint: ^9.39.1
  iron-webcrypto: ^1.2.1
  js-yaml: ^5.4.3
