# Toolchain and everyday tasks (mise). The dev server listens on HOST:PORT
# (default localhost:3000); a reverse proxy or named host stays personal:
# mise.local.toml (gitignored) overrides `dev`, see README.

[tools]
# better-sqlite3 is built for this Node line; the tests fail under Node 24.
node = "22"

[settings]
# corepack shims let pnpm resolve its version from packageManager (single source of truth)
node.corepack = true

[tasks.install]
description = "Install the dependencies"
sources = ["package.json", "pnpm-lock.yaml"]
outputs = { auto = true }
run = "pnpm install"

[tasks.dev]
description = "Nuxt dev server: http://localhost:3000 (HOST and PORT override)"
depends = ["dev:nuxt"]

[tasks."dev:nuxt"]
description = "The Nuxt dev server itself (what a proxy wraps)"
depends = ["install"]
run = "pnpm dev"

[tasks.test]
description = "Unit and golden tests"
depends = ["install"]
run = "pnpm test"

[tasks."test:watch"]
description = "Tests in watch mode"
depends = ["install"]
run = "pnpm test:watch"

[tasks.lint]
description = "ESLint on the whole repo"
depends = ["install"]
run = "pnpm eslint ."

[tasks."lint:fix"]
description = "ESLint with autofix"
depends = ["install"]
run = "pnpm eslint . --fix"

[tasks.build]
description = "Production build (themes, then Nuxt)"
depends = ["install"]
run = "pnpm build"

[tasks.check]
description = "Everything the CI checks: lint + tests"
depends = ["lint", "test"]
