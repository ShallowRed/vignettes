# Toolchain and everyday tasks (mise). One dev server per worktree: each has its
# own .nuxt, its own database in .data/ and its own portless host.

[tools]
# better-sqlite3 is built for this Node line; the tests fail under Node 24.
node = "22"
"npm:portless" = "0.15.6"

[settings]
# corepack shims let pnpm resolve its version from packageManager (single source of truth)
node.corepack = true

[env]
# The deployed instances the content tasks talk to belong to an instance rather
# than to the repository: set VIGNETTES_REMOTE and VIGNETTES_STAGING_REMOTE in
# `mise.local.toml`, which git ignores.

[tasks.install]
description = "Install the dependencies"
sources = [
  "package.json",
  "pnpm-lock.yaml"
]
outputs = { auto = true }
run = "pnpm install"

[tasks.setup]
description = "First launch: write .env with a generated session secret, install the dependencies, create the database"
depends = [ "install" ]
run = """
set -e
if [ -f .env ]; then
  echo "[setup] .env existe déjà, laissé tel quel."
else
  cp .env.example .env
  secret="$(node -e "console.log(require('node:crypto').randomBytes(24).toString('base64url'))")"
  sed -i.bak "s|change-me-to-a-random-string-of-32-chars|$secret|" .env
  rm -f .env.bak
  echo "[setup] .env écrit, NUXT_SESSION_PASSWORD généré."
fi
mise run db:migrate
echo
echo "Prêt : mise run dev:nuxt   puis http://localhost:3000"
echo "Se connecter sans OAuth : http://localhost:3000/auth/dev-login?role=owner"
"""

[tasks.dev]
description = "Nuxt behind portless; the browser opens once the app answers. Host: vignettes-studio.localhost, or <branch>.vignettes-studio.localhost in a worktree"
depends = [ "install" ]
run = "portless run mise run dev:serve"

[tasks."dev:serve"]
hide = true
run = """
mise run open "${PORTLESS_URL:-http://localhost:${PORT:-3000}}" &
pnpm dev
"""

[tasks."dev:nuxt"]
description = "The bare Nuxt dev server on HOST:PORT (default localhost:3000), for tools that expect a fixed port"
depends = [ "install" ]
run = "pnpm dev"

[tasks."site:dev"]
description = "The documentation site behind portless. Host: vignettes-site.localhost, or <branch>.vignettes-site.localhost in a worktree"
depends = [ "install" ]
dir = "site"
run = "portless run pnpm dev"

[tasks."site:generate"]
description = "Generate the documentation site as static files in site/.output/public, for the public address NUXT_SITE_URL"
depends = [ "install" ]
run = "NUXT_SITE_URL=\"${NUXT_SITE_URL:?set NUXT_SITE_URL to the public address of the site: the sitemap and llms.txt list absolute links}\" pnpm --filter vignettes-site generate"

[tasks.open]
description = "Wait until the URL answers, then open it"
run = """
bash -c '
u="$1"
browse() {
  if command -v open >/dev/null 2>&1; then open "$1"
  elif command -v xdg-open >/dev/null 2>&1; then xdg-open "$1"
  else echo "Ouvrir : $1"
  fi
}
for _ in $(seq 1 240); do
  curl -sfk -o /dev/null "$u" && { browse "$u"; exit 0; }
  sleep 0.5
done
echo "open: $u ne répond pas" >&2
' _
"""

[tasks.worktree]
description = "Create a worktree for a branch in ../vignettes.wt/<branch> with deps, database and content, ready for `mise run dev`"
usage = 'arg "<branch>"'
run = """
set -e
branch="$usage_branch"
name="${branch//\\//-}"
dir="$(dirname "$PWD")/vignettes.wt/$name"
if git show-ref --verify --quiet "refs/heads/$branch"; then
  git worktree add "$dir" "$branch"
else
  git worktree add -b "$branch" "$dir"
fi
cd "$dir"
# The content space of the main checkout, when it has one, is cloned into the worktree.
content="$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)")/presentations"
if [ -d "$content/.git" ]; then
  git clone --quiet --depth 1 "file://$content" presentations
else
  echo "[worktree] Pas d'espace de contenu dans $content, catalogue vide."
fi
mise install
pnpm install
mise run db:migrate
mise run content:import || true
echo
echo "Prêt : cd $dir && mise run dev   (https://$name.vignettes-studio.localhost)"
"""

[tasks."worktree:remove"]
description = "Remove a worktree created by `worktree` (the branch stays)"
usage = 'arg "<branch>"'
run = """
set -e
branch="$usage_branch"
name="${branch//\\//-}"
git worktree remove --force "$(dirname "$PWD")/vignettes.wt/$name"
"""

[tasks."db:migrate"]
description = "Apply the migrations to the database of the environment, PGlite in .data/pglite by default"
depends = [ "install" ]
run = "node scripts/db-migrate.ts"

[tasks."db:copy-sqlite"]
description = "Copy a local SQLite database (.data/slides.db, or --from) into the empty PGlite or PostgreSQL database of the environment"
depends = [ "install" ]
usage = """
flag "--from <file>" help="The SQLite file to copy"
"""
run = "node scripts/db-copy-sqlite.ts ${usage_from:+--from=\"$usage_from\"}"

[tasks."content:plan"]
description = "What content:import would do (dry run)"
depends = [ "install" ]
run = "node scripts/content-import.ts"

[tasks."content:import"]
description = "Import the stubs of presentations/ that the database does not own yet"
depends = [ "install" ]
run = "node scripts/content-import.ts --apply"

[tasks."content:republish"]
description = "Republish decks from their stub even when the database owns them: mise run content:republish -- <slug>[,<slug>]"
depends = [ "install" ]
usage = 'arg "<slugs>"'
run = "node scripts/content-import.ts --apply --republish=\"$usage_slugs\""

[tasks."content:republish:prod:plan"]
description = "What content:republish:prod would publish on VIGNETTES_REMOTE (dry run): mise run content:republish:prod:plan -- <slugs>"
depends = [ "install" ]
usage = 'arg "<slugs>"'
run = "sh scripts/with-secrets.sh node scripts/content-import.ts --remote=\"${VIGNETTES_REMOTE:?set VIGNETTES_REMOTE to the instance URL, e.g. in mise.local.toml}\" --republish=\"$usage_slugs\""

[tasks."content:republish:prod"]
description = "Republish decks on the production instance from their stub, through the app with NUXT_CONTENT_TOKEN: mise run content:republish:prod -- <slugs> [--force]"
depends = [ "install" ]
usage = '''
arg "<slugs>"
flag "-f --force" help="Overwrite a draft edited online and not yet published"
'''
run = "sh scripts/with-secrets.sh node scripts/content-import.ts --apply --remote=\"${VIGNETTES_REMOTE:?set VIGNETTES_REMOTE to the instance URL, e.g. in mise.local.toml}\" --republish=\"$usage_slugs\" ${usage_force:+--force}"

[tasks."content:push"]
description = "Push stubs into the production instance with NUXT_CONTENT_TOKEN (dry run; --apply writes, --staging targets the staging instance): mise run content:push -- <slug>[,<slug>]"
depends = [ "install" ]
usage = """
arg "<slugs>"
flag "--apply"
flag "--staging"
flag "--unlisted" help="Create the deck outside the catalog, reachable by its link"
flag "--content <dir>" help="Read another content directory than presentations/"
flag "--folder <slug>" help="File a created deck in this folder of the instance, whatever its project key says"
"""
run = "INFISICAL_ENV=${usage_staging:+staging} INFISICAL_SECRETS=NUXT_CONTENT_TOKEN sh scripts/with-secrets.sh node scripts/content-push.ts \"$usage_slugs\" ${usage_apply:+--apply} ${usage_staging:+--staging} ${usage_unlisted:+--unlisted} ${usage_content:+--content=\"$usage_content\"} ${usage_folder:+--folder=\"$usage_folder\"}"

[tasks."content:pull"]
description = "Pull the published version of decks from the production instance into the local database with NUXT_CONTENT_TOKEN (dry run; --apply writes, --staging reads the staging instance): mise run content:pull -- <slug>[,<slug>]"
depends = [ "install" ]
usage = """
arg "<slugs>"
flag "--apply"
flag "--staging"
"""
run = "INFISICAL_ENV=${usage_staging:+staging} INFISICAL_SECRETS=NUXT_CONTENT_TOKEN sh scripts/with-secrets.sh node scripts/content-pull.ts \"$usage_slugs\" ${usage_apply:+--apply} ${usage_staging:+--staging}"

[tasks."theme:push"]
description = "Publish tenant themes (content space) to the bucket the deployed app serves them from (dry run; --apply uploads, --staging targets the staging instance): mise run theme:push -- <name>[,<name>]"
depends = [ "install" ]
usage = """
arg "<names>"
flag "--apply"
flag "--staging"
"""
run = "INFISICAL_ENV=${usage_staging:+staging} sh scripts/with-secrets.sh node scripts/theme-push.ts \"$usage_names\" ${usage_apply:+--apply} ${usage_staging:+--staging}"

[tasks."theme:rename"]
description = "Rename the theme the decks of a deployed instance declare, in their versions, drafts and snapshots (dry run; --apply writes, --staging targets staging): mise run theme:rename -- <from> <to>"
depends = [ "install" ]
usage = """
arg "<from>"
arg "<to>"
flag "--deck <slugs>" help="Rename only these decks, among those declaring the theme"
flag "--apply"
flag "--staging"
"""
run = "INFISICAL_ENV=${usage_staging:+staging} INFISICAL_SECRETS=NUXT_CONTENT_TOKEN sh scripts/with-secrets.sh node scripts/theme-rename.ts \"$usage_from\" \"$usage_to\" ${usage_deck:+--deck=\"$usage_deck\"} ${usage_apply:+--apply} ${usage_staging:+--staging}"

[tasks."assets:push"]
description = "Mirror the deck assets of the content space (presentations/assets) to the bucket the deployed app serves them from (dry run; --apply uploads)"
depends = [ "install" ]
usage = """
flag "--apply"
"""
run = "sh scripts/with-secrets.sh node scripts/assets-push.ts ${usage_apply:+--apply}"

[tasks.freeze]
description = "Freeze a published deck into a self-contained static bundle and upload it: mise run freeze -- <alias> [--storybook <built-dir>] [--dry-run] [--no-upload]"
depends = [ "install" ]
usage = """
arg "<alias>"
flag "--storybook <dir>"
flag "--theme <name>"
flag "--dry-run"
flag "--no-upload"
"""
run = "sh scripts/with-secrets.sh node scripts/freeze.ts \"$usage_alias\" ${usage_storybook:+--storybook \"$usage_storybook\"} ${usage_theme:+--theme \"$usage_theme\"} ${usage_dry_run:+--dry-run} ${usage_no_upload:+--no-upload}"

[tasks."freeze:push"]
description = "Upload an already built bundle of .frozen/<name> to the bucket: mise run freeze:push -- <name> [--dry-run]"
depends = [ "install" ]
usage = """
arg "<name>"
flag "--dry-run"
"""
run = "sh scripts/with-secrets.sh node scripts/upload-frozen.js \"$usage_name\" ${usage_dry_run:+--dry-run}"

[tasks."freeze:check"]
description = "List the Storybook stories a deck embeds and flag the ones missing from a built Storybook: mise run freeze:check -- <deck.md> <storybook-dir>"
depends = [ "install" ]
usage = """
arg "<deck>"
arg "<storybook>"
"""
run = "node scripts/freeze-deck.js \"$usage_deck\" \"$usage_storybook\""

[tasks.test]
description = "Unit and golden tests"
depends = [ "install" ]
run = "pnpm test"

[tasks."test:e2e"]
description = "End-to-end tests on the production build, in Chromium and Firefox (first run: pnpm exec playwright install chromium firefox)"
depends = [ "install" ]
run = "pnpm build:server && pnpm test:e2e"

[tasks."test:watch"]
description = "Tests in watch mode"
depends = [ "install" ]
run = "pnpm test:watch"

[tasks.lint]
description = "ESLint on the whole repo"
depends = [ "install" ]
run = "pnpm eslint ."

[tasks."components:reference"]
description = "Write the reference of each deck component into the README of its package, from the props and the slots of its Vue file"
depends = [ "install" ]
run = "node scripts/component-reference.ts"

[tasks."deck:plugin"]
description = "Regenerate the references of the deck authoring plugin (plugins/vignettes-decks) from the deck core and the package READMEs"
depends = [ "install" ]
run = "node scripts/deck-plugin.ts"

[tasks.typecheck]
description = "vue-tsc on the whole repo"
depends = [ "install" ]
run = "pnpm exec nuxi typecheck"

[tasks."lint:fix"]
description = "ESLint with autofix"
depends = [ "install" ]
run = "pnpm eslint . --fix"

[tasks.build]
description = "Production build (themes, then Nuxt)"
depends = [ "install" ]
run = "pnpm build"

[tasks.check]
description = "Everything the CI checks: lint + types + tests"
depends = [
  "lint",
  "typecheck",
  "test"
]
