name: Public plugin repository

# Copies the tree that `scripts/plugin-mirror.ts` builds, the deck plugin with
# its marketplace, license and README, to the public repository
# ShallowRed/vignettes-plugins, for people who cannot read this repository.
#
# The `tree` job installs the dependencies and runs the tests of the tree with
# no OIDC token. The `push` job installs nothing and alone asks Infisical for
# the deploy key of the public repository, PLUGIN_MIRROR_DEPLOY_KEY, at the
# `/plugin-mirror` path of the `prod` environment, through the OIDC identity of
# `main`: that identity trusts `ref:refs/heads/main` only, and reads the whole
# environment (see `docker-publish.yml`).

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - .claude-plugin/marketplace.json
      - LICENSE
      - scripts/plugin-mirror.ts
      - .github/workflows/plugin-mirror.yml
  workflow_dispatch:

# One copy at a time: a newer push waits for the running one.
concurrency:
  group: plugin-mirror
  cancel-in-progress: false

jobs:
  tree:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test the published tree
        run: pnpm vitest run test/unit/plugin-mirror.test.ts

      - name: Build the tree
        run: node scripts/plugin-mirror.ts "$RUNNER_TEMP/tree"

      - name: Upload the tree
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-tree
          path: ${{ runner.temp }}/tree
          include-hidden-files: true # the tree holds `.claude-plugin/`
          retention-days: 1

  push:
    needs: tree
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC to Infisical, which returns PLUGIN_MIRROR_DEPLOY_KEY
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # A run whose published files differ from the head of `main` pushes
      # nothing, so that a run started again later, such as « Re-run failed
      # jobs », never replaces a newer copy: the run of the newer commit
      # publishes it.
      - name: Compare with the head of main
        id: head
        run: |
          if git diff --quiet "$GITHUB_SHA" origin/main -- plugins .claude-plugin/marketplace.json LICENSE scripts/plugin-mirror.ts .github/workflows/plugin-mirror.yml; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "The published files of ${GITHUB_SHA::7} differ from the head of main: the run of a newer commit copies them." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Download the tree
        if: steps.head.outputs.current == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: plugin-tree
          path: ${{ runner.temp }}/tree

      - name: Fetch the deploy key from Infisical (OIDC)
        if: steps.head.outputs.current == 'true'
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_MACHINE_IDENTITY_ID }}
          domain: ${{ vars.INFISICAL_API_URL }}
          oidc-audience: infisical-vignettes
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /plugin-mirror

      - name: Checkout the public repository
        if: steps.head.outputs.current == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ShallowRed/vignettes-plugins
          ssh-key: ${{ env.PLUGIN_MIRROR_DEPLOY_KEY }}
          path: mirror

      - name: Copy the tree and push
        if: steps.head.outputs.current == 'true'
        working-directory: mirror
        run: |
          set -euo pipefail
          rsync -a --delete --exclude .git "$RUNNER_TEMP/tree/" ./
          git add -A
          if git diff --cached --quiet; then
            echo "The public repository already holds this tree." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(mirror): copy ShallowRed/vignettes@${GITHUB_SHA::7}"
          git push
