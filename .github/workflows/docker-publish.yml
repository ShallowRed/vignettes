name: Build and publish Docker image

# Construit l'image SSR et la pousse sur GHCR (privée : elle contient le contenu
# privé baké au build). Le VPS pull ensuite un tag épinglé (voir vps-infra).
#
# Le token de contenu (PRESENTATIONS_REPO_TOKEN) n'est PAS un secret GitHub : il
# est récupéré depuis Infisical au runtime du workflow via OIDC (machine identity,
# gratuit en CE) — aucun credential statique dans GitHub. Il est ensuite passé au
# build en secret BuildKit (jamais écrit dans une couche de l'image).
#
# Après le build, le job `deploy` (push sur main) se connecte au VPS en SSH et
# met à jour le conteneur sur le sha exact qui vient d'être construit (CD).
#
# Prérequis (Settings > Secrets and variables > Actions > Variables) :
#   INFISICAL_API_URL             : URL de l'instance Infisical (non versionnée ici)
#   INFISICAL_MACHINE_IDENTITY_ID : UUID de la machine identity Infisical (OIDC)
#   INFISICAL_PROJECT_SLUG        : slug du projet Infisical hébergeant les secrets
#   VPS_HOST, VPS_USER            : hôte + user SSH du VPS (pour le job deploy)
# Côté Infisical : machine identity OIDC (trust du repo) avec accès LECTURE au
# projet/env, hébergeant les secrets PRESENTATIONS_REPO_TOKEN (build) et
# VPS_SSH_KEY (clé privée de déploiement, utilisée par le job deploy).

on:
  push:
    branches: [main]
    tags: ['v*']
    # Les docs ne sont pas dans l'image (.dockerignore) : un commit docs-only ne
    # doit pas déclencher un build + auto-deploy inutile.
    paths-ignore:
      - '**.md'
      - '**.txt'
      - 'docs/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # requis pour l'auth OIDC vers Infisical
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Récupère PRESENTATIONS_REPO_TOKEN depuis Infisical → variable d'env du job
      # (export-type: env par défaut). Aucun secret statique côté GitHub.
      - name: Fetch build secrets from Infisical (OIDC)
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_MACHINE_IDENTITY_ID }}
          domain: ${{ vars.INFISICAL_API_URL }}
          # Audience figée : doit être IDENTIQUE au champ « Audiences » de l'identité
          # OIDC dans Infisical (évite tout défaut GitHub implicite).
          oidc-audience: infisical-nuxt-slides
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: "/"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64 # le VPS est amd64 — évite tout build arm accidentel
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            presentations_token=${{ env.PRESENTATIONS_REPO_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # CD : met à jour le conteneur sur le VPS sur le sha fraîchement construit.
  # Uniquement sur push main (pas les tags/PR). La clé SSH est restreinte côté VPS
  # par un forced command (deploy.sh) : elle ne peut que déclencher ce déploiement.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC vers Infisical (récupère VPS_SSH_KEY)
    steps:
      - name: Fetch deploy secrets from Infisical (OIDC)
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_MACHINE_IDENTITY_ID }}
          domain: ${{ vars.INFISICAL_API_URL }}
          oidc-audience: infisical-nuxt-slides
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: "/"

      - name: Deploy to VPS over SSH
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          # VPS_SSH_KEY est injecté dans l'env du job par l'étape Infisical ci-dessus.
        run: |
          set -euo pipefail
          IMAGE_TAG="sha-$(echo "${GITHUB_SHA}" | cut -c1-7)"
          echo "Déploiement de ${IMAGE_TAG} sur ${VPS_HOST}"
          umask 077
          printf '%s\n' "${VPS_SSH_KEY}" > deploy_key
          # TOFU : on pin la clé d'hôte au premier contact. Pour durcir, remplacer
          # par une known_hosts pré-remplie (variable VPS_SSH_KNOWN_HOSTS).
          ssh-keyscan -H "${VPS_HOST}" > known_hosts 2>/dev/null
          # Le forced command côté VPS lit ce tag dans $SSH_ORIGINAL_COMMAND.
          ssh -i deploy_key -o IdentitiesOnly=yes -o UserKnownHostsFile=known_hosts \
            "${VPS_USER}@${VPS_HOST}" "${IMAGE_TAG}"
          rm -f deploy_key
