name: Build and publish Docker image

# Builds the SSR image and pushes it to GHCR. The image holds the code only:
# the content is in the database of each instance.
#
# After the build, the `deploy` job connects to the VPS over SSH and updates the
# container to the exact sha just built: a push on `staging` for the staging
# instance, a push on `main` for production.
#
# The deploy SSH key is not a GitHub secret: the job reads it from Infisical
# through OIDC (machine identity), with no static credential on GitHub.
#
# Requirements (Settings > Secrets and variables > Actions > Variables):
#   INFISICAL_API_URL             : address of the Infisical instance (not versioned here)
#   INFISICAL_MACHINE_IDENTITY_ID : UUID of the Infisical machine identity (OIDC)
#   INFISICAL_PROJECT_SLUG        : slug of the Infisical project that holds the secrets
#   VPS_HOST, VPS_USER            : SSH host and user of the VPS (for the deploy job)
# On Infisical: an OIDC machine identity that trusts the repository, with READ
# access to the project and environment holding VPS_SSH_KEY (the deploy private key).

on:
  push:
    branches: [main, staging]
    tags: ['v*']
    # The docs are not in the image (.dockerignore): a commit of docs only
    # builds and deploys nothing.
    paths-ignore:
      - '**.md'
      - '**.txt'
      - 'docs/**'
      - 'site/**'
  workflow_dispatch:

# One run at a time per branch: a newer push waits for the running deploy, and
# replaces the push that was waiting.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Lint, unit tests and e2e tests, defined once in `checks.yml`, which also
  # runs on the pull requests to `main`. On `main` and the tags, the image is
  # built and deployed once they pass; `staging` receives branches checked
  # locally and only builds.
  test:
    uses: ./.github/workflows/checks.yml
    with:
      scope: ${{ github.ref == 'refs/heads/staging' && 'build' || 'app' }}

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download the tested build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nuxt-output

      - name: Unpack the tested build
        run: tar -xf output.tar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Deck content lives in the database, so the build needs no secret and never
      # calls Infisical — only the deploy job (VPS_SSH_KEY) still does.

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          # The `output` stage of the Dockerfile becomes the build the tests ran on.
          build-contexts: output=.output
          platforms: linux/amd64 # the VPS is amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Updates the container on the VPS to the sha just built.
  # push staging -> staging env (staging.slides.…); push main -> prod env (slides.…).
  # Same image: only the `<env>` argument sent to the forced command (deploy.sh) changes.
  # On the VPS, that forced command restricts what the SSH key can run.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC to Infisical (reads VPS_SSH_KEY)
    steps:
      - name: Fetch deploy secrets from Infisical (OIDC)
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_MACHINE_IDENTITY_ID }}
          domain: ${{ vars.INFISICAL_API_URL }}
          oidc-audience: infisical-vignettes
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /

      - name: Deploy to VPS over SSH
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          # The Infisical step above puts VPS_SSH_KEY in the environment of the job.
        run: |
          set -euo pipefail
          # push staging -> staging; push main -> prod. Same image sha.
          if [ "${GITHUB_REF}" = "refs/heads/staging" ]; then TARGET_ENV=staging; else TARGET_ENV=prod; fi
          IMAGE_TAG="sha-$(echo "${GITHUB_SHA}" | cut -c1-7)"
          echo "Deploying ${IMAGE_TAG} [${TARGET_ENV}] to ${VPS_HOST}"
          umask 077
          printf '%s\n' "${VPS_SSH_KEY}" > deploy_key
          # Trust on first use: the host key is pinned at the first contact. A
          # known_hosts filled in advance (VPS_SSH_KNOWN_HOSTS variable) would be stricter.
          ssh-keyscan -H "${VPS_HOST}" > known_hosts 2>/dev/null
          # The forced command on the VPS reads `<env> <tag>` from $SSH_ORIGINAL_COMMAND.
          ssh -i deploy_key -o IdentitiesOnly=yes -o UserKnownHostsFile=known_hosts \
            "${VPS_USER}@${VPS_HOST}" "${TARGET_ENV} ${IMAGE_TAG}"
          rm -f deploy_key
