name: Build and publish Docker image

# Construit l'image SSR et la pousse sur GHCR. L'image ne contient que le code :
# le contenu vit dans la base de données de chaque instance.
#
# Après le build, le job `deploy` se connecte au VPS en SSH et met à jour le
# conteneur sur le sha exact qui vient d'être construit : push sur `staging`
# pour la préproduction, push sur `main` pour la production.
#
# La clé SSH de déploiement n'est pas un secret GitHub : le job la lit dans
# Infisical via OIDC (machine identity), sans credential statique côté GitHub.
#
# Prérequis (Settings > Secrets and variables > Actions > Variables) :
#   INFISICAL_API_URL             : URL de l'instance Infisical (non versionnée ici)
#   INFISICAL_MACHINE_IDENTITY_ID : UUID de la machine identity Infisical (OIDC)
#   INFISICAL_PROJECT_SLUG        : slug du projet Infisical hébergeant les secrets
#   VPS_HOST, VPS_USER            : hôte + user SSH du VPS (pour le job deploy)
# Côté Infisical : machine identity OIDC (trust du repo) avec accès LECTURE au
# projet/env, hébergeant le secret VPS_SSH_KEY (clé privée de déploiement).

on:
  push:
    branches: [main, staging]
    tags: ['v*']
    # Les docs ne sont pas dans l'image (.dockerignore) : un commit docs-only ne
    # doit pas déclencher un build + auto-deploy inutile.
    paths-ignore:
      - '**.md'
      - '**.txt'
      - 'docs/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Lint, tests unitaires et tests e2e, définis une seule fois dans
  # `checks.yml`, qui tourne aussi sur chaque pull request. L'image n'est
  # construite et déployée que s'ils passent.
  test:
    uses: ./.github/workflows/checks.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Deck content lives in the database, so the build needs no secret and never
      # calls Infisical — only the deploy job (VPS_SSH_KEY) still does.

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64 # le VPS est amd64 — évite tout build arm accidentel
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # CD : met à jour le conteneur sur le VPS sur le sha fraîchement construit.
  # push staging -> env staging (staging.slides.…) ; push main -> env prod (slides.…).
  # Même image, seul l'argument `<env>` envoyé au forced command (deploy.sh) change.
  # La clé SSH est restreinte côté VPS par ce forced command (deploy.sh).
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC vers Infisical (récupère VPS_SSH_KEY)
    steps:
      - name: Fetch deploy secrets from Infisical (OIDC)
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_MACHINE_IDENTITY_ID }}
          domain: ${{ vars.INFISICAL_API_URL }}
          oidc-audience: infisical-vignettes
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /

      - name: Deploy to VPS over SSH
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          # VPS_SSH_KEY est injecté dans l'env du job par l'étape Infisical ci-dessus.
        run: |
          set -euo pipefail
          # push staging -> staging ; push main -> prod. Même sha d'image.
          if [ "${GITHUB_REF}" = "refs/heads/staging" ]; then TARGET_ENV=staging; else TARGET_ENV=prod; fi
          IMAGE_TAG="sha-$(echo "${GITHUB_SHA}" | cut -c1-7)"
          echo "Déploiement [${TARGET_ENV}] de ${IMAGE_TAG} sur ${VPS_HOST}"
          umask 077
          printf '%s\n' "${VPS_SSH_KEY}" > deploy_key
          # TOFU : on pin la clé d'hôte au premier contact. Pour durcir, remplacer
          # par une known_hosts pré-remplie (variable VPS_SSH_KNOWN_HOSTS).
          ssh-keyscan -H "${VPS_HOST}" > known_hosts 2>/dev/null
          # Le forced command côté VPS lit `<env> <tag>` dans $SSH_ORIGINAL_COMMAND.
          ssh -i deploy_key -o IdentitiesOnly=yes -o UserKnownHostsFile=known_hosts \
            "${VPS_USER}@${VPS_HOST}" "${TARGET_ENV} ${IMAGE_TAG}"
          rm -f deploy_key
