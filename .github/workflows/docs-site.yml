name: Documentation site

# Publishes the documentation site (site/, Docus) to the VPS: a push on `main`
# for the address of the repository variable DOCS_SITE_URL, a push on `staging`
# for docs.staging.vignettes.io.
#
# `checks.yml` generates the site, which builds the render module and reads
# the package READMEs; this workflow sends that output. The upload goes over
# SSH with a dedicated key, which the VPS accepts for one command only, the
# `vignettes/docs-deploy.sh` script of the vps-infra repository: the key can
# replace the site, never redeploy the application. The job reads that key, VPS_DOCS_SSH_KEY, from the `/docs` path of
# Infisical over OIDC, with the repository variables INFISICAL_* and VPS_*, as
# `docker-publish.yml` does: on `staging`, the identity and the project of
# staging, whose key the VPS accepts for the staging site only.

on:
  push:
    branches: [main, staging]
    # What the site reads: its own files, the packages and their READMEs, the
    # themes, the example decks, `docs/theme-system.md` and the pictograms of the studio.
    paths:
      - 'site/**'
      - 'packages/**'
      - 'themes/**'
      - 'examples/**'
      - docs/theme-system.md
      - 'public/pictograms/**'
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:

# One upload at a time: a newer push waits for the running one.
concurrency:
  group: docs-site-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # `docker-publish.yml` checks the application on the same push: this workflow
  # generates the site only.
  site:
    uses: ./.github/workflows/checks.yml
    with:
      scope: site

  publish:
    needs: site
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC to Infisical, which returns VPS_DOCS_SSH_KEY
    steps:
      - name: Download the tested site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docs-site
          path: public

      - name: Pack the site
        run: tar -czf site.tar.gz -C public .

      - name: Fetch the deploy key from Infisical (OIDC)
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ github.ref == 'refs/heads/main' && vars.INFISICAL_MACHINE_IDENTITY_ID || vars.INFISICAL_STAGING_IDENTITY_ID }}
          domain: ${{ vars.INFISICAL_API_URL }}
          oidc-audience: infisical-vignettes
          project-slug: ${{ github.ref == 'refs/heads/main' && vars.INFISICAL_PROJECT_SLUG || vars.INFISICAL_STAGING_PROJECT_SLUG }}
          env-slug: ${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}
          secret-path: /docs

      - name: Send the site to the VPS over SSH
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          TARGET: ${{ github.ref == 'refs/heads/main' && 'docs' || 'docs-staging' }}
          # The Infisical step above puts VPS_DOCS_SSH_KEY in the job environment.
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "${VPS_DOCS_SSH_KEY}" > deploy_key
          # Trusts the host key the VPS presents now, as the deploy job of
          # docker-publish.yml does.
          ssh-keyscan -H "${VPS_HOST}" > known_hosts 2>/dev/null
          # The script on the VPS reads `docs <sha>` or `docs-staging <sha>` as the
          # command and the archive on its standard input.
          ssh -i deploy_key -o IdentitiesOnly=yes -o UserKnownHostsFile=known_hosts \
            "${VPS_USER}@${VPS_HOST}" "${TARGET} ${GITHUB_SHA:0:7}" < site.tar.gz
          rm -f deploy_key
