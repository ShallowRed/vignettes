name: Secret scan

# Détection de secrets exposés dans l'historique git (infisical scan, moteur type
# gitleaks). Échoue si une fuite est trouvée. Les faux positifs connus sont
# allowlistés dans .infisical-scan.toml (à la racine du repo, si présent).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # historique complet requis pour le scan
      - name: Install Infisical CLI
        run: |
          curl -fsSL -o "$RUNNER_TEMP/infisical.deb" https://github.com/Infisical/cli/releases/download/v0.44.4/infisical_0.44.4_linux_amd64.deb
          echo "16f1a2b890e6b1bf38e85fe5e38f698eeda101d45c1c193f07025f075df1e8f9  $RUNNER_TEMP/infisical.deb" | sha256sum -c -
          sudo dpkg -i "$RUNNER_TEMP/infisical.deb"
      - name: Scan for exposed secrets
        run: infisical scan --redact --exit-code 1
