name: Checks

# Lint, types, unit tests, end-to-end tests on the production build and the
# documentation site. Run on every pull request, and called by `docker-publish.yml`
# and `docs-site.yml` before they publish, so all go through one definition.
on:
  pull_request:
  workflow_call:
    inputs:
      skip-test-for-docs:
        description: Skip the test job when the push changes the documentation only.
        type: boolean
        default: false

concurrency:
  # A new push on a pull request cancels the previous run. Runs called by a
  # publishing workflow keep their own group and run to the end.
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Audit
        run: pnpm audit --prod --audit-level=high

      - name: Lint
        run: pnpm lint

      - name: Types
        run: pnpm exec nuxi typecheck

  # The documentation site installs the render module and publishes the package
  # READMEs: generating it checks both. Same command as `mise run site:generate`.
  site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The repository variable DOCS_SITE_URL gives the public address of the
      # site; a pull request may fall back on a placeholder, a published run may not.
      - name: Generate the site
        env:
          NUXT_SITE_URL: ${{ vars.DOCS_SITE_URL || (github.event_name == 'pull_request' && 'https://docs.example.com' || '') }}
          NODE_OPTIONS: --max-old-space-size=4096
          NUXT_TELEMETRY_DISABLED: 1
        run: pnpm --filter vignettes-site generate

      # `docs-site.yml` publishes this tested site.
      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-site
          path: site/.output/public
          retention-days: 1

  # The test job checks the application and the packages. A pull request, or a
  # caller that sets `skip-test-for-docs`, skips it when the change touches the
  # documentation only: the site, `docs/` and the Markdown files at the root.
  # `docs/theme-system.md` counts as code, since the deck plugin test reads it.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request' || inputs.skip-test-for-docs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: List the changed files
        id: diff
        env:
          FILTER: ${{ github.event_name == 'pull_request' || inputs.skip-test-for-docs }}
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}...{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          code=true
          if [ "$FILTER" = true ] && [ "${RANGE%%.*}" != 0000000000000000000000000000000000000000 ] && files=$(git diff --name-only --no-renames "$RANGE") && [ -n "$files" ]; then
            if ! printf '%s\n' "$files" | grep -vE '^(site/|docs/|[^/]+\.md$)' | grep -q . && ! printf '%s\n' "$files" | grep -qx docs/theme-system.md; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Build
        env:
          NUXT_TELEMETRY_DISABLED: 1
        run: pnpm build:server

      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium firefox

      - name: End-to-end tests
        run: pnpm test:e2e

      # The publishing workflow builds its image from this tested build. The tar
      # keeps the links Nitro makes between its packages, which an artifact
      # would turn into copies, loading a package twice.
      - name: Pack the build
        if: github.event_name != 'pull_request'
        run: tar -cf output.tar .output

      - name: Upload the build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nuxt-output
          path: output.tar
          retention-days: 1

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
