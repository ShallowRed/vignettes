name: Checks

# Lint, types, unit tests and end-to-end tests on the production build. Run on every
# pull request, and called by `docker-publish.yml` before it builds the image,
# so both go through one definition.
on:
  pull_request:
  workflow_call:

concurrency:
  # A new push on a pull request cancels the previous run. Runs called by the
  # publishing workflow keep their own group and run to the end.
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Types
        run: pnpm exec nuxi typecheck

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          NUXT_TELEMETRY_DISABLED: 1
        run: pnpm build

      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium firefox

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
