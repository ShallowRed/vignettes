name: Checks

# Lint, tests unitaires et tests e2e sur le build de production. Tournent sur
# chaque pull request, et sont appelés par `docker-publish.yml` avant de
# construire l'image : une seule définition pour les deux.
on:
  pull_request:
  workflow_call:

concurrency:
  # Un nouveau push sur une PR annule le run précédent ; les runs appelés par le
  # workflow de publication gardent leur propre groupe et ne s'annulent pas.
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          NUXT_TELEMETRY_DISABLED: 1
        run: pnpm build

      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium firefox

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
