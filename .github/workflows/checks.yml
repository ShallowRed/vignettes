name: Checks

# Lint, types, unit tests, end-to-end tests on the production build and the
# documentation site, in one definition. A pull request into `main` runs what
# its changes need; `docker-publish.yml` and `docs-site.yml` call it with the
# part they publish.
on:
  pull_request:
    # A pull request higher in a stack is checked once it targets `main`, and a
    # draft once it is ready for review.
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
    inputs:
      scope:
        description: '`app` checks and builds the application, `build` builds it without checking it (staging), `site` generates the documentation site.'
        type: string
        default: app

concurrency:
  # A new push on a pull request cancels the previous run. Runs called by a
  # publishing workflow keep their own group and run to the end.
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What to run: on a pull request, the test job when the change touches more
  # than the documentation (the site, `docs/` and the Markdown files at the
  # root; `docs/theme-system.md` counts as code, since the deck plugin test
  # reads it), and the site job when it touches what the site reads, the paths
  # of `docs-site.yml`. A call runs what its scope names. GitHub applies the
  # `paths` filter to a whole workflow, not to one of its jobs
  # (https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#onpushpull_requestpull_request_targetpathspaths-ignore),
  # so this job compares the files itself.
  changes:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
      site: ${{ steps.diff.outputs.site }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: List the changed files
        id: diff
        env:
          SCOPE: ${{ inputs.scope }}
          RANGE: ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            if [ "$SCOPE" = site ]; then code=false site=true; else code=true site=false; fi
          else
            files=$(git diff --name-only --no-renames "$RANGE")
            code=false site=false
            if printf '%s\n' "$files" | grep -vE '^(site/|docs/|[^/]+\.md$)' | grep -q . || printf '%s\n' "$files" | grep -qx docs/theme-system.md; then
              code=true
            fi
            if printf '%s\n' "$files" | grep -qE '^(site/|packages/|themes/|examples/|public/pictograms/|docs/theme-system\.md$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$)'; then
              site=true
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "site=$site" >> "$GITHUB_OUTPUT"

  # The documentation site installs the render module and publishes the package
  # READMEs: generating it checks both. Same command as `mise run site:generate`.
  site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The repository variable DOCS_SITE_URL gives the public address of the
      # site; a pull request may fall back on a placeholder, a published run may not.
      - name: Generate the site
        env:
          NUXT_SITE_URL: ${{ vars.DOCS_SITE_URL || (github.event_name == 'pull_request' && 'https://docs.example.com' || '') }}
          NODE_OPTIONS: --max-old-space-size=4096
          NUXT_TELEMETRY_DISABLED: 1
        run: pnpm --filter vignettes-site generate

      # `docs-site.yml` publishes this tested site.
      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-site
          path: site/.output/public
          retention-days: 1

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The Playwright image holds the browsers and the system packages they need.
    # Its tag follows `@playwright/test` in the catalog of pnpm-workspace.yaml.
    # https://playwright.dev/docs/ci#via-containers
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Staging receives branches checked locally: it builds them only.
      - name: Audit
        if: inputs.scope != 'build'
        run: pnpm audit --prod --audit-level=high

      - name: Lint
        if: inputs.scope != 'build'
        run: pnpm lint

      - name: Types
        if: inputs.scope != 'build'
        run: pnpm exec nuxi typecheck

      - name: Unit tests
        if: inputs.scope != 'build'
        run: pnpm test

      - name: Build
        env:
          NUXT_TELEMETRY_DISABLED: 1
        run: pnpm build:server

      # A pull request runs Chromium; `main` runs Firefox too.
      - name: End-to-end tests
        if: inputs.scope != 'build'
        env:
          PROJECTS: ${{ github.event_name == 'pull_request' && '--project=chromium' || '' }}
        run: pnpm test:e2e ${PROJECTS:+"$PROJECTS"}

      # The publishing workflow builds its image from this tested build. The tar
      # keeps the links Nitro makes between its packages, which an artifact
      # would turn into copies, loading a package twice.
      - name: Pack the build
        if: github.event_name != 'pull_request'
        run: tar -cf output.tar .output

      - name: Upload the build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nuxt-output
          path: output.tar
          retention-days: 1

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
